[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axiomata"
version = "0.3.0"
description = "Toolkit for mathematical and CS proof, analysis, and reasoning."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Miko Villa", email = "dev@mikovilla.com" }
]
keywords = [
    "mathematics",
    "computer-science",
    "proof",
    "theorem",
    "reasoning",
    "analysis",
    "algorithms",
    "discrete-math",
    "education",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = ["sympy"]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/mikovilla/axiomata"
Issues = "https://github.com/mikovilla/axiomata/issues"
PyPI = "https://pypi.org/project/axiomata/"

[tool.hatch.build.targets.wheel]
packages = ["axiomata"]
